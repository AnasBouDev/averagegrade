<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calculatrice de moyenne scolaire Maroc (3ème année)" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap"
    rel="stylesheet">
  <title>Calculatrice Moyenne</title>
  <link rel="icon" type="image/svg+xml" href="/averagegrade/logo.svg" />
  <script type="module" crossorigin src="/averagegrade/assets/index-CNx2Zd_T.js"></script>
  <link rel="stylesheet" crossorigin href="/averagegrade/assets/index-CnKKAg8R.css">
</head>

<body>
  <header>
    <div class="brand-container">
      <svg class="app-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 20V5l7 9 7-10" />
      </svg>
      <h1>Mes Notes</h1>
    </div>
    <div class="header-controls">
      <div class="user-greeting" id="userGreeting"></div>
      <div class="settings-container">
        <button id="settingsToggle" class="icon-btn" aria-label="Paramètres">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.39a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
            </path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
        <div class="settings-menu" id="settingsMenu">
          <div class="settings-item">
            <span id="settingLabelLanguage">Language</span>
            <div class="mini-lang-picker">
              <button class="mini-lang-btn" data-lang="en">🇬🇧</button>
              <button class="mini-lang-btn" data-lang="fr">🇫🇷</button>
              <button class="mini-lang-btn" data-lang="ar">🇸🇦</button>
            </div>
          </div>
          <div class="settings-item">
            <span id="settingLabelTheme">Mode Nuit</span>
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Changer de thème">
              <div class="toggle-thumb"></div>
            </button>
          </div>
          <div class="settings-item">
            <span id="settingLabelColor">Couleur</span>
            <div class="mini-color-picker" id="miniColorPicker"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="subjects-grid" id="subjectsGrid">
      <!-- Subjects will be injected here via JS -->
    </div>
  </main>

  <div class="summary-bar">
    <div>
      <div class="general-avg-label">Moyenne Générale</div>
      <div class="general-avg-value" id="generalAverage">--/20</div>
    </div>
    <button class="reset-btn" id="resetBtn">Tout réinitialiser</button>
  </div>

  <!-- Welcome Modal -->
  <div class="modal-overlay" id="welcomeModal">
    <div class="modal">
      <h2>Bienvenue !</h2>
      <p>Commençons par personnaliser ton expérience.</p>

      <div class="step-container" data-step="1">
        <div class="language-selection">
          <button class="lang-card" data-lang="en">
            <span class="flag">🇬🇧</span>
            <span class="lang-name">English</span>
          </button>
          <button class="lang-card" data-lang="fr">
            <span class="flag">🇫🇷</span>
            <span class="lang-name">Français</span>
          </button>
          <button class="lang-card" data-lang="ar">
            <span class="flag">🇸🇦</span>
            <span class="lang-name">العربية</span>
          </button>
        </div>
      </div>

      <div class="step-container hidden" data-step="2">
        <div class="form-group">
          <label for="userName">Ton prénom</label>
          <input type="text" id="userName" class="text-input" placeholder="Ex: Karim" autocomplete="given-name">
        </div>

        <div class="form-group">
          <label>Choisis ta couleur préférée</label>
          <div class="color-options" id="colorOptions">
            <!-- Color options will be generated -->
          </div>
        </div>

        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label for="modalThemeToggle" style="margin-bottom: 0;">Mode Sombre</label>
          <button id="modalThemeToggle" class="theme-toggle-btn" aria-label="Activer le mode sombre">
            <div class="toggle-thumb"></div>
          </button>
        </div>

        <button class="btn-primary" id="startBtn">C'est parti !</button>
      </div>
    </div>
  </div>

  <!-- Secret Modal -->
  <div class="modal-overlay" id="secretModal">
    <div class="modal">


      <div class="form-group">
        <label for="secretPass">Mot de passe</label>
        <input type="password" id="secretPass" class="text-input" placeholder="***" autocomplete="off">
      </div>

      <div style="display: flex; gap: 1rem;">
        <button class="reset-btn" id="cancelSecretBtn"
          style="flex: 1; border-color: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface);">Annuler</button>
        <button class="btn-primary" id="confirmSecretBtn" style="flex: 1;">Valider</button>
      </div>
    </div>
  </div>

</body>

</html>
